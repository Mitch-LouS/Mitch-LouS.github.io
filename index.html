<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vicinity Viral - Video Editor Portfolio</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #ff7b00; 
            --accent-gradient: linear-gradient(135deg, #ff7b00, #ff4500);
            --card-bg: #111111;
            --card-border: #1a1a1a;
            --input-bg: #161616;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navigation Header */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: opacity 0.3s, color 0.3s;
        }

        nav a:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        /* Common Layout Classes */
        section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
            text-align: center;
        }

        .btn-orange {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent-gradient);
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
        }

        .btn-orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 123, 0, 0.5);
        }

        /* Hero Section */
        #home {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        .hero-image-container {
            display: flex;
            justify-content: center;
        }

        .hero-frame {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            padding: 4px;
            background: var(--accent-gradient);
            box-shadow: 0 0 30px rgba(255, 123, 0, 0.2);
        }

        .hero-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #222;
        }

        .hero-content {
            text-align: left;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero-content .highlight {
            color: var(--accent-color);
            display: block;
        }

        .hero-subtitle {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .hero-description {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            max-width: 550px;
        }

        /* About Section */
        #about {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 4rem;
            align-items: start;
            border-top: 1px solid var(--card-border);
        }

        .about-image-container {
            display: flex;
            justify-content: center;
        }

        .about-frame {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            padding: 4px;
            background: var(--accent-gradient);
        }

        .about-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #222;
        }

        .about-content .section-title {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .bio-text {
            font-size: 1.05rem;
            opacity: 0.9;
            margin-bottom: 2.5rem;
        }

        .bio-text strong {
            color: var(--accent-color);
        }

        .skills-heading {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .skill-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .skill-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        /* Showreels Section */
        #showreels {
            border-top: 1px solid var(--card-border);
            text-align: center;
        }

        .showreel-banner {
            background-color: #0a0a0a;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 3rem;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
        }

        .showreel-banner h3 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .showreel-banner p {
            color: var(--accent-color);
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .showreel-placeholder-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .showreel-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #222;
        }

        /* Featured Work Grid Section */
        #work {
            border-top: 1px solid var(--card-border);
        }

        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 3rem;
        }

        .work-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s;
        }

        .work-card:hover {
            transform: scale(1.02);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 177.77%; /* 9:16 Aspect Ratio */
            background-color: #000;
        }

        .video-container iframe, .video-container video, .video-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        .play-button-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 123, 0, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.5);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid white;
            margin-left: 4px;
        }

        .video-info {
Use code with caution.
padding: 1rem;
font-size: 0.9rem;
font-weight: 500;
background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
position: absolute;
bottom: 0;
width: 100%;
}
/* Contact Section */
#contact {
border-top: 1px solid var(--card-border);
text-align: center;
}
.contact-subtitle {
font-size: 1.1rem;
opacity: 0.8;
margin-bottom: 2rem;
max-width: 600px;
margin-left: auto;
margin-right: auto;
}
.contact-form-container {
max-width: 600px;
margin: 0 auto;
background-color: var(--card-bg);
border: 1px solid var(--card-border);
padding: 2.5rem;
border-radius: 16px;
}
.form-group {
margin-bottom: 1.5rem;
text-align: left;
}
.form-control {
width: 100%;
background-color: var(--input-bg);
border: 1px solid var(--card-border);
border-radius: 8px;
padding: 1rem;
color: #fff;
font-family: inherit;
font-size: 0.95rem;
transition: border-color 0.3s;
}
.form-control:focus {
outline: none;
border-color: var(--accent-color);
}
textarea.form-control {
resize: vertical;
min-height: 120px;
}
.social-links {
display: flex;
justify-content: center;
gap: 1.5rem;
margin-top: 3rem;
}
.social-icon {
color: #fff;
font-size: 1.5rem;
text-decoration: none;
opacity: 0.7;
transition: opacity 0.3s, color 0.3s;
}
.social-icon:hover {
opacity: 1;
color: var(--accent-color);
}
footer {
text-align: center;
padding: 2rem;
font-size: 0.85rem;
opacity: 0.5;
border-top: 1px solid var(--card-border);
}
/* Responsive Layout adjustments */
@media (max-width: 900px) {
#home, #about {
grid-template-columns: 1fr;
text-align: center;
gap: 2rem;
}
.about-content .section-title {
text-align: center;
}
.hero-content {
text-align: center;
display: flex;
flex-direction: column;
align-items: center;
}
.skills-grid {
grid-template-columns: repeat(2, 1fr);
}
.showreel-placeholder-grid {
grid-template-columns: repeat(2, 1fr);
}
.work-grid {
grid-template-columns: repeat(2, 1fr);
}
}
@media (max-width: 600px) {
.skills-grid, .work-grid, .showreel-placeholder-grid {
grid-template-columns: 1fr;
}
header {
flex-direction: column;
gap: 1rem;
}
nav a {
margin: 0 0.75rem;
}
.hero-content h1 {
font-size: 2.5rem;
}
}
